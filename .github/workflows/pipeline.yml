# Game Night's pipeline (docs/CI.md). One workflow, run in stages; each stage starts only if the one before it passed.
#
#   1 · Build ─▶ 2 · Unit tests ─▶ 3 · Coverage ─▶ 4 · End-to-end (macOS) ─▶ 5 · Package ─▶ 6 · Approve ─▶ 7 · Release
#
# Every push to a branch and every pull request into main: stages 1–5 (the zip is kept as a download for 2 weeks).
# A release, all seven stages, started either way:
#   - the Release button: Actions → Pipeline → Run workflow, type the version (1.2.0); stage 7 creates the v1.2.0 tag
#   - or a version tag pushed from your Mac: git tag v1.2.0 && git push origin v1.2.0
# Stage 6 waits for you to click Approve on GitHub (the "release" environment), then stage 7 publishes the release with the zip.
name: Pipeline
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:            # the Release button (Actions → Pipeline → Run workflow)
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.1 (without the v). Releases the latest main.'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}   # a newer push replaces a running one; releases always finish
env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
  # the release's version: the pushed tag, or v + the version typed on the Release button
  VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  build:
    name: 1 · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the cache-version check compares with the previous commit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check the release version and that it's on main (releases only, so a mistake fails in seconds)
        if: env.RELEASE == 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF_NAME" = main ] || { echo "Releases are made from main: pick main under 'Use workflow from' (got $GITHUB_REF_NAME)."; exit 1; }
            echo "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Type the version as 1.0.1 (three numbers, no v). Got: $INPUT_VERSION"; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/$VERSION_TAG" >/dev/null; then echo "$VERSION_TAG already exists: pick a new version."; exit 1; fi
          else                                     # a tag pushed from a Mac
            echo "$VERSION_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tags for releases look like v1.0.1 (got $VERSION_TAG). Delete it: git push origin :$VERSION_TAG && git tag -d $VERSION_TAG"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$VERSION_TAG is not on main: releases are made from main only. Delete it: git push origin :$VERSION_TAG && git tag -d $VERSION_TAG"; exit 1; }
          fi
          echo "Releasing $VERSION_TAG from main at ${GITHUB_SHA::7}."
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - run: npm ci
      - name: Build check (files parse, links, offline cache, games registered, cache version)
        run: node scripts/stage.js build --base "$BASE"
        env:
          CI_STAGE: 1/7
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

  unit:
    name: 2 · Unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: All unit tests, recording coverage for the next stage (failed tests retried at the end; then the whole stage, up to 3 times)
        run: node scripts/stage.js unit
        env:
          CI_STAGE: 2/7
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: coverage/raw/
          retention-days: 3

  coverage:
    name: 3 · Coverage
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4      # same paths as stage 2, so its coverage data lines up with the files
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: coverage-data
          path: coverage/raw/
      - name: Coverage gate (each file against its minimum in coverage-thresholds.json)
        run: node scripts/stage.js coverage
        env:
          CI_STAGE: 3/7
      - name: Coverage table on the run's summary page
        if: always()
        run: |
          if [ -f coverage/summary.txt ]; then { echo '### Unit test coverage'; echo '```'; cat coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/summary.txt
            coverage/summary.json
          if-no-files-found: ignore

  e2e:
    name: 4 · End-to-end tests (macOS)
    needs: coverage
    runs-on: macos-latest       # like the Mac that hosts game night: Chrome is preinstalled
    timeout-minutes: 75         # ~11 min a run here; retries can add more (a stuck run is stopped at 75)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Real games in Chrome with simulated phones (failed tests retried at the end; then the whole stage, up to 3 times)
        run: node scripts/stage.js e2e
        env:
          CI_STAGE: 4/7
          E2E_OUT: ${{ runner.temp }}/e2e
          E2E_WORKERS: '2'        # CI machines are smaller than a desktop Mac: 2 tests at a time
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs-and-screenshots
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  package:
    name: 5 · Package
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the zip and smoke-test it (unpack, install, start, load the pages)
        run: node scripts/stage.js package "$VERSION"
        env:
          CI_STAGE: 5/7
          VERSION: ${{ env.RELEASE == 'true' && env.VERSION_TAG || format('dev-{0}', github.sha) }}
      - uses: actions/upload-artifact@v4
        with:
          name: game-night-package
          path: dist/
          retention-days: 14

  approve:
    name: 6 · Approve release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    environment: release         # waits here until a required reviewer approves (set up once: docs/CI.md)
    steps:
      - run: echo "Release ${{ env.VERSION_TAG }} approved. Stages 1–5 passed for ${{ github.sha }}."

  release:
    name: 7 · Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write            # only this stage may publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only from main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$VERSION_TAG is not on main: releases are made from main only."; exit 1; }
      - name: Tag the release (Release button only; a pushed tag already exists)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION_TAG" "$GITHUB_SHA" -m "Game Night $VERSION_TAG"
          git push origin "$VERSION_TAG"      # pushed by the pipeline itself, so it doesn't start another run
      - uses: actions/download-artifact@v4
        with:
          name: game-night-package
          path: dist/
      - name: Publish the GitHub release with the zip (notes generated from the changes since the last release)
        run: gh release create "$VERSION_TAG" dist/* --verify-tag --title "Game Night $VERSION_TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
