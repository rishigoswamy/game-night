# Releases (docs/CI.md). Every release is a commit on main that has passed the pipeline (pipeline.yml), and every release
# waits for you to click Approve ("release" environment: Review deployments → Approve and deploy, or Reject to skip it).
#
# Three ways in:
#   1. Automatically: after every green pipeline run on main, a release candidate. Its version is the next patch after
#      the latest release, or the next minor / major if a commit since then says [minor] / [major] (scripts/next-version.js).
#      A newer candidate replaces one still waiting; a rejected or ignored candidate is simply skipped.
#   2. The Release button: Actions → Release → Run workflow → choose patch / minor / major (or type an exact version).
#      It releases the latest main, which must have passed the pipeline.
#   3. A version tag pushed from a Mac (git tag v1.2.0 && git push origin v1.2.0): released once the pipeline passes for it.
name: Release
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Release button: {0}', inputs.version || inputs.bump)
  || github.event.workflow_run.conclusion != 'success' && format('No release (pipeline failed) · {0}', github.event.workflow_run.display_title)
  || startsWith(github.event.workflow_run.head_branch, 'v') && format('Release {0} (tag)', github.event.workflow_run.head_branch)
  || format('Release candidate · {0}', github.event.workflow_run.display_title) }}
on:
  workflow_run:
    workflows: [Pipeline]
    types: [completed]
    branches: [main, 'v*']       # pushes to main, and version tags (feature branches never release)
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch = fixes (1.4.3 → 1.4.4) · minor = a new feature in a game (→ 1.5.0) · major = a new game (→ 2.0.0)'
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Or an exact version, e.g. 1.5.0 (optional; overrides the choice above)'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  # automatic candidates share one group, so a newer one replaces one still waiting; button and tag releases never cancel
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && 'release-candidate' || format('release-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # all commits and tags: the version comes from the latest release and the commits since
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
      - id: sha
        name: The commit to release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Release button only, from main, and main must have passed the pipeline
        if: github.event_name == 'workflow_dispatch'
        run: |
          [ "$GITHUB_REF_NAME" = main ] || { echo "Run the Release button from main (Use workflow from: main), not $GITHUB_REF_NAME."; exit 1; }
          green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pipeline.yml/runs?head_sha=$(git rev-parse HEAD)&status=success" --jq '.total_count')
          [ "$green" -gt 0 ] || { echo "The latest main ($(git rev-parse --short HEAD)) hasn't passed the pipeline: wait until its run is green, then try again."; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
      - id: v
        name: Work out the version
        run: |
          # only versions published as GitHub Releases count (a stray tag can't change the numbers)
          export RELEASED_TAGS="$(gh release list --limit 1000 --json tagName --jq '.[].tagName')"
          node scripts/next-version.js
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
          PUSHED_TAG: ${{ startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.head_branch || '' }}

  approve:
    name: Approve ${{ needs.version.outputs.tag }}
    needs: version
    if: needs.version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    environment: release         # waits here for a required reviewer: Review deployments → Approve and deploy / Reject
    steps:
      - run: echo "${{ needs.version.outputs.tag }} approved for commit ${{ needs.version.outputs.sha }}."

  publish:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: [version, approve]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write            # only this job may publish
    env:
      TAG: ${{ needs.version.outputs.tag }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Package the release (the zip, smoke-tested)
        run: npm run package -- "$TAG"
      - name: Tag it (a tag pushed from a Mac is already there)
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # a tag pushed from a Mac for this release; release tags are permanent, so never publish onto one elsewhere
            [ "$(git rev-list -n 1 "$TAG")" = "$SHA" ] || { echo "$TAG already exists on another commit; release tags can't be moved. Use a new version."; exit 1; }
            echo "$TAG already exists on this commit."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "Game Night $TAG"
          git push origin "$TAG"      # pushed by a workflow, so it doesn't start the pipeline again (the commit already passed)
      - name: Publish the GitHub release with the zip (notes generated from the changes since the last release)
        run: gh release create "$TAG" dist/* --verify-tag --title "Game Night $TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
